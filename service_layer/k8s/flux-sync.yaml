apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homeserver
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/fedextm/homeserver-immutable
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homeserver
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: homeserver
