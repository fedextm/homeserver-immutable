apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      hostNetwork: true
      dnsPolicy: Default          # сам Pi-hole не должен зависеть от CoreDNS
      containers:
        - name: pihole
          image: docker.io/pihole/pihole:2026.04.1
          env:
            - name: TZ
              value: Europe/Warsaw
            - name: FTLCONF_dns_interface
              value: eth1          # проверьте имя через `ip -br link`
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-web
                  key: password
            - name: FTLCONF_dns_upstreams
              value: "8.8.8.8;8.8.4.4"
            - name: FTLCONF_dns_dnssec
              value: "true"
            - name: FTLCONF_dhcp_active
              value: "true"
            - name: FTLCONF_dhcp_start
              value: 192.168.250.100
            - name: FTLCONF_dhcp_end
              value: 192.168.250.110
            - name: FTLCONF_dhcp_leaseTime
              value: 7d
            - name: FTLCONF_dhcp_router
              value: 192.168.250.3
            - name: FTLCONF_webserver_port
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 1024Mi
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_TIME", "SYS_NICE"]
          volumeMounts:
            - name: etc-pihole
              mountPath: /etc/pihole
            - name: etc-dnsmasq
              mountPath: /etc/dnsmasq.d
          startupProbe:
            exec:
              command: ["dig", "+short", "+time=2", "+tries=1", "@127.0.0.1", "pi.hole"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["dig", "+short", "+time=2", "+tries=1", "@127.0.0.1", "pi.hole"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: etc-pihole
          hostPath:
            path: /var/mnt/data/ct_data/pihole/etc-pihole
            type: Directory
        - name: etc-dnsmasq
          hostPath:
            path: /var/mnt/data/ct_data/pihole/etc-dnsmasq
            type: Directory