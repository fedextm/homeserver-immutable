global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'srv01'
    static_configs:
      - targets: ['192.168.3.201:9100']
        labels:
          instance: 'srv01'
  - job_name: 'hostkey'
    static_configs:
      - targets: ['151.243.196.109:9100']
        labels:
          instance: 'hostkey'
  - job_name: 'srv01-podman-containers'
    static_configs:
      - targets: ['192.168.3.201:9882']
        labels:
          instance: 'srv01-containers'
  - job_name: 'homeserver'
    static_configs:
      - targets: ['192.168.250.3:9100']
        labels:
          instance: 'homeserver'
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['192.168.250.3:8082']
        labels:
          instance: 'homeserver'
    metric_relabel_configs:
      # cAdvisor вне kubelet отдаёт имена пода/неймспейса только как container_label_*
      - source_labels: [container_label_io_kubernetes_pod_namespace]
        target_label: namespace
      - source_labels: [container_label_io_kubernetes_pod_name]
        target_label: pod
      - source_labels: [container_label_io_kubernetes_container_name]
        target_label: container
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-state-metrics.svc:8080']
        labels:
          instance: 'homeserver'
