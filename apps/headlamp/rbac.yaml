apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
---
# Права самого пода Headlamp. Вход в UI идёт по токену пользователя,
# поэтому реальные права определяет токен (kubectl -n headlamp create token headlamp-admin), права cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin   # полный доступ; UI доступен только из LAN, наружу порт не открыт
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
